name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows executable
        run: |
          cd client
          pyinstaller --onefile monitor.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-windows
          path: client/dist/monitor.exe
          retention-days: 7

  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build macOS executable
        run: |
          cd client
          pyinstaller --onefile monitor.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-macos
          path: client/dist/monitor
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: monitor-windows
          path: ./artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: monitor-macos
          path: ./artifacts/macos

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum windows/monitor.exe > checksums.txt
          sha256sum macos/monitor >> checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/windows/monitor.exe
            artifacts/macos/monitor
            artifacts/checksums.txt
          body: |
            ## MapleTing ${{ steps.version.outputs.version }}


            ### 다운로드

            - Windows: monitor.exe
            - macOS: monitor


            ### 설치 방법

            1. 사용 중인 플랫폼에 맞는 바이너리를 다운로드합니다.
            2. 원하는 디렉토리에 파일을 배치합니다.
            3. 동일한 디렉토리에 config.json 파일을 생성합니다. (하단의 설정 파일 참조)
            4. 바이너리를 실행합니다.

            ### 무결성 검증

            다운로드한 파일이 변조되지 않았는지 확인하려면 제공된 checksums.txt를 사용하세요.

            ```
            # Linux/macOS
            shasum -a 256 -c checksums.txt

            # Windows (PowerShell)
            Get-FileHash monitor.exe -Algorithm SHA256
            ```


            ### 설정 파일 (config.json)

            `내_게임_닉네임`은 꼭 수정해주세요.

            ```
            {
              "server_url": "https://mapleting.vercel.app",
              "nickname": "내_게임_닉네임",
              "package_name": "com.nexon.ma",
              "check_interval_seconds": 60
            }
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-tag:
    name: Commit and Tag (Manual Only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-macos]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create and push tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
